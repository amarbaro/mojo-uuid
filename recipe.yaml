# rattler-build recipe, modular-community shape.
# Build locally: rattler-build build -r recipe.yaml -c https://conda.modular.com/max -c conda-forge
context:
  version: 0.1.2

package:
  name: "mojo-uuid"
  version: ${{ version }}

source:
  - path: .

build:
  number: 0
  script:
    - mojo precompile src/uuid -I ${{ PREFIX }}/lib/mojo -o ${{ PREFIX }}/lib/mojo/uuid.mojoc

requirements:
  host:
    - mojo-compiler >=1.2.0,<1.3
    - mojo-hashlib >=0.1.2,<0.2
  build:
    - mojo-compiler >=1.2.0,<1.3
  run:
    - ${{ pin_compatible('mojo-compiler', upper_bound='x.x') }}
    - mojo-hashlib >=0.1.2,<0.2  # .mojoc loads only on the minor it was built with

tests:
  - script:
    - if: unix
      then:
        - mojo build -I src examples/quickstart.mojo -o quickstart
    files:
      source:
        - src/
        - examples/

about:
  homepage: https://github.com/amarbaro/mojo-uuid
  license: Apache-2.0
  license_file: LICENSE
  summary: RFC UUID values, parsing, formatting and generation for Mojo
  repository: https://github.com/amarbaro/mojo-uuid

extra:
  maintainers:
    - amarbaro.org
  project_name:
    - mojo-uuid
