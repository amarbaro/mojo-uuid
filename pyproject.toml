[project]
name = "mojo-uuid"
version = "0.1.1"
description = "RFC UUID values, parsing, formatting and generation for Mojo"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[project.urls]
Homepage = "https://github.com/amarbaro/mojo-uuid"
Repository = "https://github.com/amarbaro/mojo-uuid"

[tool.mojo]
deps = ["mojo-hashlib >=0.1.2,<0.2"]
